<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101B3E"/>
      <stop offset="1" stop-color="#070B1E"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.38" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset="0.45" stop-color="#A8C8F2"/>
      <stop offset="1" stop-color="#5E82C9"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7D488"/>
      <stop offset="0.5" stop-color="#F0C45C"/>
      <stop offset="1" stop-color="#D9A83F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FC2FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9FC2FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="planetClip">
      <circle cx="256" cy="238" r="128"/>
    </clipPath>
  </defs>

  <!-- night-sky tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#space)"/>

  <!-- stars -->
  <g fill="#DCE9FF">
    <circle cx="88" cy="96" r="3" opacity="0.9"/>
    <circle cx="150" cy="60" r="2" opacity="0.6"/>
    <circle cx="412" cy="76" r="2.5" opacity="0.8"/>
    <circle cx="452" cy="140" r="2" opacity="0.5"/>
    <circle cx="70" cy="210" r="2" opacity="0.5"/>
    <circle cx="440" cy="330" r="2.5" opacity="0.7"/>
    <circle cx="60" cy="400" r="3" opacity="0.6"/>
    <circle cx="120" cy="452" r="2" opacity="0.45"/>
    <circle cx="398" cy="452" r="2" opacity="0.55"/>
    <circle cx="330" cy="52" r="1.8" opacity="0.5"/>
    <path d="M 356 110 l 3.2 8.2 8.8 0.6 -6.8 5.6 2.2 8.5 -7.4 -4.8 -7.4 4.8 2.2 -8.5 -6.8 -5.6 8.8 -0.6 z" fill="#F7D488" opacity="0.85"/>
  </g>

  <!-- planet glow -->
  <circle cx="256" cy="238" r="196" fill="url(#glow)"/>

  <!-- ring, back half (behind the planet) -->
  <g transform="rotate(-16 256 238)">
    <path d="M 256 238 m -216 0 a 216 74 0 0 1 432 0"
          fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- planet -->
  <circle cx="256" cy="238" r="128" fill="url(#planet)"/>
  <!-- soft terminator shading -->
  <g clip-path="url(#planetClip)">
    <circle cx="300" cy="286" r="150" fill="#4C6FB6" opacity="0.35"/>
    <!-- a couple of subtle bands -->
    <ellipse cx="256" cy="238" rx="128" ry="128" fill="none"/>
    <path d="M 140 200 q 60 18 232 6" stroke="#C9DCF6" stroke-width="10" fill="none" opacity="0.35"/>
    <path d="M 136 262 q 80 16 244 2" stroke="#89A9DE" stroke-width="12" fill="none" opacity="0.28"/>
  </g>

  <!-- ring, front half (over the planet) -->
  <g transform="rotate(-16 256 238)">
    <path d="M 256 238 m -216 0 a 216 74 0 0 0 432 0"
          fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"/>
    <!-- ring shadow on the planet -->
    <path d="M 256 238 m -120 26 a 130 46 0 0 0 240 0"
          fill="none" stroke="#3E5C9E" stroke-width="9" opacity="0.35"/>
  </g>

  <!-- the face -->
  <g fill="#141824">
    <ellipse cx="216" cy="222" rx="14" ry="20"/>
    <ellipse cx="296" cy="222" rx="14" ry="20"/>
    <path d="M 228 276 q 28 22 56 0" stroke="#141824" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
  <!-- cheek highlights on the eyes -->
  <circle cx="220" cy="215" r="4" fill="#DCE9FF" opacity="0.85"/>
  <circle cx="300" cy="215" r="4" fill="#DCE9FF" opacity="0.85"/>
</svg>
